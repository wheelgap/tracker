name: Gap wheel build

# One build of one gap-wheels pair, started by gap-wheels.yml (`gap_wheels.py dispatch`). Each build gets a workflow
# run of its own so that its artifact token, which the package's build code can read, can't write another build's
# result: the coordinator takes a result only from the one run with that build's exact title. See
# scripts/gap_wheels.py. Nothing here is published, and this run's token is read-only. Don't add actions/cache (or a
# setup action's cache) here: build code can write cache entries other workflows on main would restore.
run-name: gap-wheel ${{ inputs.batch }} ${{ inputs.name }} ${{ inputs.version }} ${{ inputs.target }} build ${{ inputs.attempt }}

on:
  workflow_dispatch:
    inputs:
      batch:
        required: true
      name:
        required: true
      version:
        required: true
      target:
        required: true
      attempt:
        required: true
      runner:
        required: true
      python:
        required: true
      image:
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: inputs.image == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python }}
      - name: Build from the sdist, hash, and (build 1) install
        shell: bash
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          ATTEMPT: ${{ inputs.attempt }}
          RUNNER: ${{ inputs.runner }}
        run: python scripts/gap_wheels.py build --name "$NAME" --version "$VERSION" --target "$TARGET" --attempt "$ATTEMPT" --runner "$RUNNER" --out result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result
          path: |
            result.json
            members.json
          if-no-files-found: ignore
          retention-days: 7

  build-docker:
    # JavaScript actions can't run inside an Alpine container on ARM runners, so the build runs in `docker run`.
    if: inputs.image != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build from the sdist, hash, and (build 1) install, with Alpine's build-base
        env:
          IMAGE: ${{ inputs.image }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          ATTEMPT: ${{ inputs.attempt }}
          RUNNER: ${{ inputs.runner }}
        run: |
          # The checkout is mounted read-only; the result goes to its own folder.
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm -v "$PWD:/lab:ro" -v "$RUNNER_TEMP/out:/out" -w /lab -e NAME -e VERSION -e TARGET -e ATTEMPT -e RUNNER "$IMAGE" sh -c \
            'apk add --no-cache build-base >/dev/null && python scripts/gap_wheels.py build --name "$NAME" --version "$VERSION" --target "$TARGET" --attempt "$ATTEMPT" --runner "$RUNNER" --out /out/result.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result
          path: |
            ${{ runner.temp }}/out/result.json
            ${{ runner.temp }}/out/members.json
          if-no-files-found: ignore
          retention-days: 7
