name: GIL spike (not for merging)

on:
  pull_request:
    paths: [".github/workflows/gil-spike.yml", "scripts/gil_spike.py"]

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install each top-1000 package's free-threaded wheel and import it
        run: python scripts/gil_spike.py data/coverage.json --top 1000 --python "$(which python)" | tee gil.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gil
          path: gil.jsonl
