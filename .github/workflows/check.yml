name: Check

# Runs the offline tests for scripts/ and a syntax check of the site on every pull request,
# so a broken script or app.js is caught before the nightly scan or a deploy uses it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # No cache: the build lab runs package code on main and could write entries this restores.
          enable-cache: false
      - name: Tests
        # Pinned like the actions above, so a new pytest release can't change or break the check unannounced.
        run: uvx --python 3.14 pytest@8.4.2  # the Python the nightly scan runs the scripts with
      - name: Check notes
        # Stdlib only; validates notes/*.toml against data/coverage.json.
        run: python3 scripts/check_notes.py
      - name: Repo checker driver
        # site/check/driver.py against the wheelgap release site/check/worker.mjs runs in the browser.
        # test_check_parity.py compares its answers with that release's CLI, for every file format the page reads.
        run: |
          pin=$(sed -n 's/^export const WHEELGAP = "wheelgap==\(.*\)";$/\1/p' site/check/worker.mjs)
          # --refresh-package: never an older page for wheelgap, cached from before a release.
          uvx --python 3.14 --refresh-package wheelgap --with "wheelgap==$pin" pytest@8.4.2 tests/test_check_driver.py tests/test_check_parity.py
      - name: Site syntax
        run: node --check site/logic.js && node --check site/not-found.js && node --check site/app.js && node --check site/lab.js && for f in site/check/*.mjs; do node --check "$f"; done
      - name: Site logic
        # The runner's own node; node:test needs nothing installed.
        run: node --test tests/site/logic.test.js tests/site/scripts.test.js tests/site/check-logic.test.mjs tests/site/check-page.test.mjs tests/site/app.test.js tests/site/not-found.test.js
