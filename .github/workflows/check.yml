name: Check

# Runs the offline tests for scripts/ and a syntax check of the site on every pull request,
# so a broken script or app.js is caught before the nightly scan or a deploy uses it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tests
        # Pinned like the actions above, so a new pytest release can't change or break the check unannounced.
        run: uvx --python 3.14 pytest@8.4.2  # the Python the nightly scan runs the scripts with
      - name: Check notes
        # Stdlib only; validates notes/*.toml against data/coverage.json.
        run: python3 scripts/check_notes.py
      - name: Site syntax
        run: node --check site/logic.js && node --check site/app.js
      - name: Site logic
        # The runner's own node; node:test needs nothing installed.
        run: node --test tests/site/logic.test.js
