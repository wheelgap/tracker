name: Scan and publish

# Nightly: scan the top PyPI packages with wheelgap, check the result, commit the data, and publish
# the site. Pushing a change to the site (or running this by hand) republishes without a scan.
#
# Hardening: the scan runs third-party code (wheelgap and its dependencies from PyPI) with a
# read-only token and no stored credentials. A separate job, which runs no third-party code,
# commits only data/. Every action is pinned to a commit.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      scan:
        description: Run a fresh scan before publishing
        type: boolean
        default: true
      allow_drop:
        description: Accept a scan whose wheel counts fell more than 10% (a genuine change, not an outage)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "campaigns.toml", "data/campaigns/**", ".github/workflows/scan.yml"]

permissions:
  contents: read

env:
  # The wheelgap release that produces the data. Bump it to pick up new targets.
  WHEELGAP: "wheelgap==0.9.0"
  TOP: "5000"

jobs:
  scan:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scan)
    runs-on: ubuntu-latest
    # A normal scan takes about a minute. If PyPI is down, each lookup retries with backoff,
    # so cap the job instead of letting five slow attempts run to GitHub's 6-hour limit.
    timeout-minutes: 60
    concurrency:
      group: scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the latest history, even if this run waited behind another scan
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Keep the previous scan
        # The scan overwrites data/coverage.json; update_changes.py compares against this copy.
        # It isn't committed or uploaded.
        run: cp data/coverage.json previous.json
      - name: Scan
        # Retry with a fresh index: a release can take a few minutes to reach PyPI's CDN, and
        # wheelgap refuses to write a scan where more than 5% of lookups failed (exit 1).
        run: |
          for attempt in 1 2 3 4 5; do
            uv run --no-project --refresh --with "$WHEELGAP" python -m wheelgap.scan --top "$TOP" --out data/coverage.json && exit 0
            echo "attempt $attempt failed, retrying in 60s"; sleep 60
          done
          exit 1
      - name: Check the scan looks right
        env:
          ALLOW_DROP: ${{ inputs.allow_drop && '1' || '' }}
        run: python3 scripts/check_scan.py data/coverage.json data/history.json "$TOP"
      - name: Update history
        run: python3 scripts/update_history.py data/coverage.json data/history.json
      - name: Record the wheels gained and lost
        # Extra data: if it fails, still commit the night's scan (the script writes changes.json last).
        continue-on-error: true
        run: python3 scripts/update_changes.py previous.json data/coverage.json data/changes.json
      - name: Record new campaigns' starting to-do lists
        # Writes data/campaigns/<id>.json once per campaign and never rewrites it. Extra data too:
        # if it fails, warn and still commit the night's scan; the next scan tries again.
        run: |
          python3 scripts/build_campaigns.py --record-baselines data/coverage.json data/changes.json campaigns.toml data/campaigns \
            || echo "::warning::Couldn't record campaign baselines; the next scan will try again."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data
          path: |
            data/coverage.json
            data/history.json
            data/changes.json
            data/campaigns/

  commit:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: data
      - id: push
        name: Commit only data/, retrying if main moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coverage.json data/history.json data/changes.json
          # Baselines: the artifact comes from a job that ran third-party code, so undo any change to the
          # committed ones and add only new files named data/campaigns/<campaign id>.json.
          if [ -n "$(git ls-files data/campaigns)" ]; then git checkout -- data/campaigns; fi
          skipped=0
          while IFS= read -r -d '' f; do
            if [[ "$f" =~ ^data/campaigns/[a-z0-9]+(-[a-z0-9]+)*\.json$ ]]; then git add -- "$f"; else skipped=$((skipped + 1)); fi
          done < <(git ls-files -z --others --exclude-standard -- data/campaigns)
          if [ "$skipped" -gt 0 ]; then echo "::warning::Not committing $skipped unexpected file(s) in data/campaigns"; fi
          git diff --cached --quiet || git commit -m "Scan $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 10))
            git pull --rebase origin main
          done
          echo "couldn't push the scan after 5 attempts" >&2
          exit 1

  publish:
    needs: [scan, commit]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # One deploy at a time, each from the latest main, so an older run can't overwrite newer data.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the latest site and data, including anything the commit job just pushed
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/*.json _site/data/
          python3 scripts/build_lookup.py data/coverage.json _site/data/packages
          python3 scripts/build_csv.py data/coverage.json _site/data/coverage.csv
          python3 scripts/build_most_wanted.py data/coverage.json _site/data/most-wanted.json
          python3 scripts/build_badges.py data/coverage.json _site/badge
          python3 scripts/build_pages.py data/coverage.json _site
          python3 scripts/build_campaigns.py data/coverage.json data/history.json data/changes.json campaigns.toml _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
